<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c3440">
  <title>Easy Visa｜兑换码提取</title>
  <style>
    :root{--navy:#0c3440;--mint:#52e3b2;--teal:#078a78;--paper:#f2f7f5;--ink:#082b37;--muted:#60747a;--line:#d5e3df;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.hero{background:var(--navy);color:#fff;padding:26px max(20px,calc((100% - 680px)/2)) 70px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--mint);color:var(--navy);font-size:22px}.hero h1{margin:44px 0 8px;font-size:clamp(30px,7vw,46px);line-height:1.12}.hero h1 span{color:var(--mint)}.hero p{margin:0;color:#c8d9dc}.wrap{width:min(680px,calc(100% - 28px));margin:-38px auto 40px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(22px,5vw,38px);box-shadow:0 16px 42px rgba(8,43,55,.09)}.tag{display:inline-block;padding:4px 11px;border-radius:999px;background:#e7f8f2;color:#087564;font-size:13px;font-weight:700}h2{margin:18px 0 4px;font-size:24px}label{display:block;margin:24px 0 8px;font-weight:750}.field{display:flex;gap:10px}input{min-width:0;flex:1;height:52px;border:1.5px solid #b8cbc6;border-radius:12px;padding:0 15px;font:600 17px/1 monospace;color:var(--ink);text-transform:uppercase;outline:none}input:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(7,138,120,.12)}button,.link{border:0;border-radius:12px;background:var(--navy);color:#fff;padding:0 22px;height:52px;font-weight:800;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.message{min-height:28px;margin:10px 0 0;color:var(--danger)}.result{display:none;margin-top:24px;padding:20px;border:1px solid #afe1d3;border-radius:16px;background:#effbf7}.result.show{display:block}.result small{color:var(--muted)}.code-row{display:flex;align-items:center;gap:10px;margin-top:8px}.code{flex:1;overflow-wrap:anywhere;font:800 20px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.04em}.copy{height:42px;padding:0 15px;background:var(--teal)}.notes{margin:24px 0 0;padding:18px 20px;background:#f8faf9;border-radius:14px;color:var(--muted);font-size:14px}.notes strong{color:var(--ink)}.back{display:inline-block;margin-top:22px;color:var(--teal);font-weight:700;text-decoration:none}footer{text-align:center;color:#738589;font-size:13px;padding:0 20px 30px}@media(max-width:520px){.field{display:block}.field button{width:100%;margin-top:10px}.code-row{align-items:stretch;flex-direction:column}.copy{width:100%}}
  </style>
</head>
<body>
  <header class="hero"><div class="brand"><span class="mark">✳</span>Easy Visa</div><h1>闲鱼订单<br><span>兑换码提取</span></h1><p>输入成交订单号，查看该订单对应的评估兑换码。</p></header>
  <main class="wrap"><section class="card"><span class="tag">订单自助提取</span><h2>提取你的兑换码</h2><p>请填写完整的闲鱼订单号。订单号仅用于匹配兑换码。</p><form id="form"><label for="order">闲鱼订单号</label><div class="field"><input id="order" name="order" inputmode="numeric" autocomplete="off" maxlength="40" placeholder="请输入完整订单号" required><button id="submit" type="submit">立即提取</button></div><div id="message" class="message" role="status" aria-live="polite"></div></form><div id="result" class="result"><small>该订单对应的兑换码</small><div class="code-row"><div id="code" class="code"></div><button id="copy" class="copy" type="button">复制兑换码</button></div></div><div class="notes"><strong>温馨提示</strong><br>提取兑换码不会消耗评估次数。兑换码的 30 天有效期从首次进入评估系统时开始计算；请勿向他人公开订单号和兑换码。</div><a class="back" href="./">已有兑换码？进入评估系统 →</a></section></main>
  <footer>Easy Visa · 美国 B 类签证通过率评估系统</footer>
  <script>
    const API='https://1497204468-dzk39cygvt.ap-guangzhou.tencentscf.com';
    const form=document.getElementById('form'),order=document.getElementById('order'),submit=document.getElementById('submit'),message=document.getElementById('message'),result=document.getElementById('result'),code=document.getElementById('code'),copy=document.getElementById('copy');
    order.addEventListener('input',()=>{order.value=order.value.replace(/\s+/g,'').toUpperCase();result.classList.remove('show');message.textContent=''});
    form.addEventListener('submit',async event=>{event.preventDefault();const value=order.value.trim();if(!/^[A-Z0-9-]{10,40}$/.test(value)){message.textContent='请检查并输入完整的闲鱼订单号。';return}submit.disabled=true;submit.textContent='正在查询…';message.textContent='';result.classList.remove('show');try{const response=await fetch(API+'/pickup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderNumber:value})});const data=await response.json();if(response.status===404){message.textContent='暂未查到该订单，请确认订单号或联系卖家。';return}if(!response.ok||!data.ok)throw new Error('request_failed');code.textContent=data.code;result.classList.add('show')}catch{message.textContent='查询服务暂时不可用，请稍后再试。'}finally{submit.disabled=false;submit.textContent='立即提取'}});
    copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(code.textContent);copy.textContent='已复制';setTimeout(()=>copy.textContent='复制兑换码',1600)}catch{message.textContent='复制失败，请长按兑换码手动复制。'}});
  </script>
</body>
</html>
