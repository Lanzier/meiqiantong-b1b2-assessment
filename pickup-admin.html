<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Easy Visa｜订单发码管理</title>
  <style>*{box-sizing:border-box}body{margin:0;background:#f2f7f5;color:#082b37;font:16px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.head{background:#0c3440;color:#fff;padding:28px 20px}.head div,main{width:min(640px,100%);margin:auto}.head b{font-size:20px}.head p{margin:5px 0 0;color:#c8d9dc}main{padding:26px 16px}.card{background:#fff;border:1px solid #d5e3df;border-radius:18px;padding:26px}label{display:block;font-weight:750;margin:18px 0 7px}input{width:100%;height:50px;padding:0 14px;border:1.5px solid #b8cbc6;border-radius:11px;font:600 16px monospace;outline:none}input:focus{border-color:#078a78;box-shadow:0 0 0 4px rgba(7,138,120,.12)}button{width:100%;height:52px;margin-top:24px;border:0;border-radius:11px;background:#0c3440;color:#fff;font-weight:800;font-size:16px}button:disabled{opacity:.6}.msg{min-height:28px;margin-top:12px;color:#b42318}.msg.ok{color:#087564}.note{margin-top:20px;padding:14px;background:#f1f8f6;border-radius:10px;color:#60747a;font-size:14px}</style>
</head>
<body><header class="head"><div><b>Easy Visa · 订单发码管理</b><p>成交后登记闲鱼订单号与兑换码。</p></div></header><main><section class="card"><form id="form"><label for="admin">管理员兑换码</label><input id="admin" type="password" autocomplete="current-password" required><label for="order">闲鱼订单号</label><input id="order" inputmode="numeric" autocomplete="off" maxlength="40" required><label for="code">分配的评估兑换码</label><input id="code" autocomplete="off" maxlength="24" required><button id="submit" type="submit">登记并开放提取</button><div id="message" class="msg" role="status"></div></form><div class="note">同一个订单号或兑换码只能登记一次。登记成功后，买家即可在公开提卡页用订单号提取。管理员密码不会保存在本页面。</div></section></main><script>const API='https://1497204468-dzk39cygvt.ap-guangzhou.tencentscf.com',form=document.getElementById('form'),admin=document.getElementById('admin'),order=document.getElementById('order'),code=document.getElementById('code'),submit=document.getElementById('submit'),message=document.getElementById('message');for(const field of[order,code])field.addEventListener('input',()=>field.value=field.value.replace(/\s+/g,'').toUpperCase());form.addEventListener('submit',async event=>{event.preventDefault();message.className='msg';message.textContent='';submit.disabled=true;submit.textContent='正在登记…';try{const response=await fetch(API+'/pickup/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminCode:admin.value,orders:[{orderNumber:order.value,code:code.value}]})}),data=await response.json();if(response.status===403){message.textContent='管理员兑换码不正确。';return}if(!response.ok||!data.ok)throw new Error('request_failed');if(data.imported!==1){message.textContent='未登记：订单号或兑换码无效、已被使用，或兑换码不存在。';return}message.className='msg ok';message.textContent='登记成功，买家现在可以凭该订单号提取。';order.value='';code.value=''}catch{message.textContent='登记服务暂时不可用，请稍后再试。'}finally{submit.disabled=false;submit.textContent='登记并开放提取'}});</script></body>
</html>
