n- und Ausreisehistorie'},ja:{'Visa category and application location':'ビザ区分と申請地','Trip purpose and itinerary':'渡航目的と日程','Stay and return plan':'滞在・帰国計画','Trip funding':'旅行費用','Bank statements and domestic assets':'銀行明細と国内資産','Post-trip arrangements':'旅行後の予定','Application form and history':'申請書と申請履歴','International visas and travel history':'海外ビザと渡航履歴','DS-160 and information consistency':'DS-160と情報の整合性','Prior refusal history':'過去の拒否履歴','Existing visa information':'既存ビザ情報','Entry/exit history':'出入国履歴'}}[lang];document.querySelector('.badge').textContent=c.badge;document.getElementById('assessment-title').textContent=c.calculating;document.querySelector('.score-number span').textContent=c.rate;document.querySelector('.score-summary h3').textContent=`${c.readiness} ${score.total} · ${pdfBand(score.total,'prep')}`;document.querySelector('.score-summary p').textContent=pdfCopy().basis;document.querySelector('.stat').innerHTML=`<strong>${confirmed}/${total}</strong><div><b>${c.stat}</b>${c.pending}</div>`;document.querySelector('.check-title').textContent=c.checklist;document.querySelector('.priority h3').textContent=c.priority;document.querySelector('.sources h3').textContent=c.sources;const pendingTitles=[];document.querySelectorAll('.report-grid .row').forEach(row=>{const h=row.querySelector('h3'),p=row.querySelector('p'),status=row.querySelector('.status');if(h&&titles[h.textContent])h.textContent=titles[h.textContent];if(status?.classList.contains('wait')||status?.classList.contains('review')){pendingTitles.push(h?.textContent||'');if(p)p.textContent=c.reviewText(h?.textContent||'');status.textContent=status.classList.contains('review')?c.review:c.needs}else{if(p?.textContent.startsWith('Confirmed:'))p.textContent=c.confirmedPrefix+p.textContent.slice(10).trim();if(status)status.textContent=c.confirmed}});document.querySelectorAll('.priority li').forEach((li,i)=>li.textContent=c.reviewText(pendingTitles[i]||c.priority));document.querySelectorAll('.warning').forEach     function animateAssessmentScore(target){const circle=el.querySelector('.score-circle'),number=circle?.querySelector('strong'),title=document.getElementById('assessment-title');if(!circle||!number||!title)return;const mix=(from,to,ratio)=>from.map((part,i)=>Math.round(part+(to[i]-part)*ratio)),appearance=value=>{const red=[229,57,53],yellow=[250,204,21],green=[34,197,94],gold=[255,215,0];let rgb,band,glow=0;if(value<40){rgb=mix(red,yellow,value/40);band='low'}else if(value<75){rgb=mix(yellow,green,(value-40)/35);band='medium'}else if(value<95){rgb=green;band='high'}else{rgb=gold;band='excellent';glow=1}return{band,color:`rgb(${rgb.join(',')})`,glow}},paint=value=>{const look=appearance(value);circle.dataset.scoreBand=look.band;circle.style.setProperty('--score-color',look.color);circle.style.setProperty('--score-glow-color',`rgba(255,205,0,${(.18+.52*look.glow).toFixed(2)})`);circle.style.setProperty('--score-glow-near',Math.round(12*look.glow)+'px');circle.style.setProperty('--score-glow-far',Math.round(28*look.glow)+'px')};paint(0);const finish=()=>{paint(target);circle.style.setProperty('--score',target);number.textContent=target+'%';title.textContent=`${pdfCopy().rate}: ${target}%`};if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches){finish();return}circle.classList.add('score-animating');const duration=1650,start=performance.now();function frame(now){const progress=Math.min((now-start)/duration,1),eased=1-Math.pow(1-progress,3),value=Math.round(target*eased);paint(value);circle.style.setProperty('--score',value);number.textContent=value+'%';if(progress<1)requestAnimationFrame(frame);else finish()}requestAnimationFrame(frame)}

    function webMcp(){const context=document.modelContext;if(!context?.registerTool)return;const validation=(id,val)=>{const q=questions.find(x=>x.id===id);if(!q||!active().some(x=>x.id===id))throw Error('题目不存在或当前不适用');if(q.type==='text'){if(typeof val!=='string'||val.trim().length<2||val.length>80)throw Error('请输入有效的'+(q.inputLabel||'国家或地区名称'))}else if(q.multi){if(!Array.isArray(val)||!val.length||val.some(x=>!q.options.some(y=>y.id===x))||(val.includes('unsure')&&val.length>1))throw Error('多选答案无效')}else if(typeof val!=='string'||!q.options.some(x=>x.id===val))throw Error('选项无效');return q};try{Promise.resolve(context.registerTool({name:'answer_assessment_question',title:'填写申请准备问卷',description:'按题目 ID 填写当前适用的问卷答案并更新页面。',inputSchema:{type:'object',properties:{questionId:{type:'string'},answer:{oneOf:[{type:'string'},{type:'array',items:{type:'string'}}]}},required:['questionId','answer'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:({questionId,answer})=>{validation(questionId,answer);if(view==='intro')view='question';setAnswer(questionId,answer);let pos=active().findIndex(x=>x.id===questionId);if(pos>=0)index=pos;render();return{questionId,answer,visibleQuestion:active()[index]?.id}}})).catch(()=>{})}catch{}}
    function localizedIntro(){if(!['fr','de','ja'].includes(lang)){intro();return}const copy={fr:{badge:'B1 / B2 · Évaluation intelligente gratuite',title:'Quel est votre taux estimé de réussite au visa américain ?',desc:'Statistiques publiques, préparation du DS-160 et facteurs d’entretien servent à produire une évaluation et une liste personnalisée.',items:['Environ 5 à 8 minutes avec des questions adaptées','Motif du voyage, financement, retour, DS-160 et historique','Aucun nom, numéro de passeport ou adresse requis'],start:'Commencer l’évaluation'},de:{badge:'B1 / B2 · Kostenlose intelligente Bewertung',title:'Wie hoch ist Ihre geschätzte Erfolgsquote für ein US-Visum?',desc:'Öffentliche Statistiken, DS-160-Vorbereitung und Interviewfaktoren ergeben eine Bewertung und persönliche Checkliste.',items:['Etwa 5–8 Minuten mit passenden Fragen','Reisezweck, Finanzierung, Rückkehr, DS-160 und Historie','Kein Name, keine Passnummer oder Adresse erforderlich'],start:'Bewertung starten'},ja:{badge:'B1 / B2・無料スマート評価',title:'米国ビザの推定通過率はどのくらいですか？',desc:'公開統計、DS-160の準備状況、面接関連要素から評価と個別チェックリストを作成します。',items:['状況に応じた質問で約5～8分','渡航目的、費用、帰国計画、DS-160、申請履歴を確認','氏名、旅券番号、住所は不要です'],start:'評価を開始'}},c=copy[lang];el.innerHTML=`<span class="badge">${c.badge}</span><h2>${c.title}</h2><p class="hint">${c.desc}</p><ul class="intro-list">${c.items.map(item=>`<li>${item}</li>`).join('')}</ul><div class="actions"><span></span><button class="primary" id="start">${c.start} →</button></div>`;document.getElementById('start').onclick=()=>{view='question';index=0;render()}}
    function localizeChromeAndControls(){const copy={fr:{assessment:'Évaluation de préparation',report:'Votre rapport d’évaluation',done:'Terminé',time:'Environ 5–8 minutes',question:'Question',back:'Retour',next:'Suivant',view:'Voir le rapport'},de:{assessment:'Bewertung der Vorbereitung',report:'Ihr Bewertungsbericht',done:'Abgeschlossen',time:'Etwa 5–8 Minuten',question:'Frage',back:'Zurück',next:'Weiter',view:'Bericht anzeigen'},ja:{assessment:'申請準備評価',report:'評価レポート',done:'完了',time:'約5～8分',question:'質問',back:'戻る',next:'次へ',view:'レポートを見る'}},c=copy[lang];if(!c)return;document.getElementById('top-label').textContent=view==='report'?c.report:view==='question'?sectionText(active()[index]?.section):c.assessment;document.getElementById('count-label').textContent=view==='question'?`${c.question} ${index+1} / ${active().length}`:view==='report'?c.done:c.time;const back=document.getElementById('back'),next=document.getElementById('next');if(back)back.textContent=`← ${c.back}`;if(next)next.textContent=`${index===active().length-1?c.view:c.next} →`}
    render();webMcp();
  })();
  </script>
  <script>
